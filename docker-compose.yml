name: tuniku

services:
  tuniku:
    image: ghcr.io/maroishiku/tuniku:0.3.3@sha256:40a83603f67d73ec9cfeb22bde5f11f57fee1278c45a7272e52184a42e7fa606
    pull_policy: always
    container_name: tuniku
    hostname: tuniku
    environment:
      ISHIKU_SETUP_SECRET: ""
      ISHIKU_DATA_DIR: "/data"
      ISHIKU_LOG_LEVEL: "info"
      TUNIKU_DATA_PATH: "/data"
      TUNIKU_LOG_LEVEL: "info"
      HTTPS_ONLY: "false"
      TUNIKU_ALLOW_LOOPBACK_UPSTREAM: "false"
      TUNIKU_DOCKER_PROXY_URL: "http://tuniku-docker-observer:2375"
      TUNIKU_TRUSTED_PROXY_COUNT: "0"
      TZ: "Europe/Berlin"
    ports:
      - target: 8080
        published: "65001"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/i_tuniku/Data
        target: /data
    networks:
      - tuniku
      - tuniku_observer
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "536870912"
    cpus: 1.0
    init: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      icon: https://raw.githubusercontent.com/MaroIshiku/tuniku/main/public/assets/icons/icon-512.png
      org.opencontainers.image.description: Secure self-hosted Gluetun dashboard and Compose assistant.
      org.opencontainers.image.source: https://github.com/MaroIshiku/tuniku
      org.opencontainers.image.title: Tuniku - Gluetun Web Interface
      org.opencontainers.image.url: https://github.com/MaroIshiku/tuniku
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 5m
    restart: unless-stopped

  tuniku-docker-observer:
    image: ghcr.io/maroishiku/tuniku:0.3.3@sha256:40a83603f67d73ec9cfeb22bde5f11f57fee1278c45a7272e52184a42e7fa606
    pull_policy: always
    container_name: tuniku-docker-observer
    command: ["dist/server/docker/observerProxy.js"]
    user: "0:0"
    environment:
      TUNIKU_OBSERVER_PORT: "2375"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - tuniku_observer
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: "134217728"
    cpus: 0.25
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /data:size=1m,mode=0700
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:2375/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

networks:
  tuniku:
    name: tuniku
    driver: bridge
  tuniku_observer:
    name: tuniku-observer
    internal: true
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  author: MaroIshiku
  category: Network
  developer: MaroIshiku
  hostname: ""
  icon: https://raw.githubusercontent.com/MaroIshiku/tuniku/main/public/assets/icons/icon-512.png
  index: /
  is_uncontrolled: false
  main: tuniku
  port_map: "65001"
  scheme: http
  store_app_id: tuniku
  title:
    custom: Tuniku - Gluetun Web Interface
    en_us: Tuniku
  tagline:
    en_us: Secure Gluetun dashboard and Compose assistant.
  description:
    en_us: Observe and control supported Gluetun functions and generate safe manual Compose guidance.
  thumbnail: https://raw.githubusercontent.com/MaroIshiku/tuniku/main/public/assets/icons/icon-512.png
  tips:
    before_install:
      en_us: |
        Required: set ISHIKU_SETUP_SECRET to at least 32 random characters before starting. Tuniku creates and persists its internal session and credential-encryption keys automatically under /data.

        The initial stack contains the Tuniku application and an internal diagnostic helper, but no Gluetun service, so an unconfigured VPN cannot block first start or enter a restart loop. After creating the first admin, choose Create Gluetun configuration in Tuniku and deploy the generated Gluetun-only add-on stack. It uses qmcgaw/gluetun:latest, joins the existing external network named tuniku, and does not duplicate Tuniku or port 65001.

        The diagnostic helper has no host port and exposes only Gluetun list, inspect, and log reads to Tuniku on an internal network. It never runs docker exec and Tuniku remains available when Gluetun fails.

        HTTPS_ONLY=false supports direct local HTTP access. Set HTTPS_ONLY=true only when Tuniku is reached through an HTTPS reverse proxy; signed-in HTTP access then intentionally stops working because the session cookie becomes Secure.

        Persistent Tuniku data is stored at /DATA/AppData/i_tuniku/Data. The generated Gluetun add-on uses a Docker-managed gluetun_data volume; back it up separately. Back up existing data before switching an older Tuniku named-volume installation to this host path.

        Tuniku runs as UID/GID 1000. If the host creates the Tuniku data directory with different ownership, run `chown -R 1000:1000 /DATA/AppData/i_tuniku/Data` before deployment.
