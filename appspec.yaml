        "Main and stable releases retain latest eligibility but share a registry writer lock, use distinct event candidates and promote the checked digest only after matching architecture source labels and ancestry; older sources do not replace newer latest and version tags remain immutable.",
        "Publishing resolves the exact amd64 and arm64 child manifest digests, requires matching image architecture/source and successful bounded lifecycle tests for each, then scans each child digest for HIGH/CRITICAL vulnerabilities before promotion. Index, source and runtime identities remain in the release evidence."
