{
  "schema_version": 1,
  "application": {
    "id": "tuniku",
    "name": "Tuniku",
    "family": "ishiku",
    "locale": "en"
  },
  "summary": "Provide a secure dashboard for Gluetun Control Server functions and a generation-only Compose assistant.",
  "requirements": [
    {
      "id": "CORE-001",
      "title": "Core product behavior",
      "priority": "critical",
      "acceptance": [
        "Provide a secure dashboard for Gluetun Control Server functions and a generation-only Compose assistant.",
        "Existing documented and reachable behavior remains available unless an approved migration decision says otherwise."
      ],
      "security_critical": false
    },
    {
      "id": "AUTH-001",
      "title": "Secure account access",
      "priority": "critical",
      "acceptance": [
        "Account authentication uses generic errors, rate limits, and a supported password hash.",
        "Sessions are server-side revocable, rotated, time-bounded, cookie-protected, and CSRF-protected."
      ],
      "security_critical": true
    },
    {
      "id": "SETUP-001",
      "title": "Consistent first-run deployment",
      "priority": "critical",
      "acceptance": [
        "The primary ZimaOS Compose exposes exactly one operator-provided ISHIKU_SETUP_SECRET with a minimum length of 32 characters.",
        "Tuniku generates and persists internal session and credential-encryption keys under /data without exposing them as additional new-install Compose fields.",
        "Legacy file-backed and environment secret overrides remain compatible, and existing encrypted credentials have an explicit migration warning."
      ],
      "security_critical": true
    },
    {
      "id": "UI-001",
      "title": "Consistent English interface",
      "priority": "high",
      "acceptance": [
        "All user-facing interface text is English.",
        "The app uses ishiku semantic tokens, shared layout contracts, responsive behavior, and WCAG 2.2 AA interaction.",
        "Browser, PWA, launcher, catalog, and in-app consumers use the approved Tuniku icon family."
      ],
      "security_critical": false
    },
    {
      "id": "OPS-001",
      "title": "Safe standalone operation",
      "priority": "high",
      "acceptance": [
        "A fresh clone can build, test, and run without the outer workspace.",
        "Health checks, persistent data, runtime secrets, backup, restore, and upgrade procedures are verifiable.",
        "The primary ZimaOS Compose uses direct scalar values, the standard application metadata, and persistent host paths while publishing assigned host port 65001 to container port 8080."
      ],
      "security_critical": true
    },
    {
      "id": "REL-001",
      "title": "Reproducible release",
      "priority": "high",
      "acceptance": [
        "Pull requests and releases use clone-local verification scripts.",
        "Released images are immutable, scanned, SBOM-equipped, provenance-attested, and rollback-documented.",
        "GHCR latest promotion is gated on full verification of the same commit."
      ],
      "security_critical": true
    }
  ]
}
