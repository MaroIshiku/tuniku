    {
      "id": "MGMT-001",
      "title": "Optional confirmed VPN stack management",
      "priority": "critical",
      "acceptance": [
        "The optional internal helper requires a persistent private key, explicit Compose project and data-root allowlists, and authenticated CSRF-protected application requests. Export-only operation remains available when it is disabled.",
        "Adoption requires confirmation and includes every existing routed application in the same approved project. Cross-project migration, privileged workloads and static network addresses require separate review.",
        "A secret-free expiring preview precedes confirmed provider, VPN credential, server-selection and published-port changes. Configuration or running-state drift and replay prevent mutations.",
        "Recreation pins existing image identities, retains named and anonymous volumes, preserves Control Server settings, waits for VPN health before starting applications, and attaches them to the new VPN namespace.",
        "Encrypted atomic journals retain recovery information. Failed rollback leaves applications stopped; interrupted operations lock the project and never replay automatically.",
        "New deployments, moving existing applications between projects, image updates and automated recovery remain outside this initial profile and are not advertised as implemented.",
        "Changed published ports are checked against other Docker bindings during preview and again before mutation; non-Docker listeners and concurrent allocation remain Docker runtime checks.",
        "Read-only diagnostics inspect only adopted IDs in currently approved projects and isolate missing, changed-owner and outdated namespace states without Docker mutations or secret-bearing configuration output.",
        "Read-only candidate inventory maps actual VPN namespace references only within allowed projects, marks unknown and other networks, excludes recovery copies from adoption, and preselects known related applications only for explicit ownership review. Cross-project dependencies remain visible and block same-project adoption; the server retains final scope and namespace validation.",
        "Encrypted adoption and successful-apply references allow read-only comparison of actual configured Docker state, separately from process health and saved drafts. Missing legacy references, out-of-scope/missing containers and stale observations remain unverified; no environment values or baseline snapshots reach status or diagnostics responses. Successful operations refresh the selected stack inspection; incomplete operations block new previews and never replay automatically.",
        "Managed patches preserve omitted provider settings, expose explicit removals and target individual port bindings. Server selection cannot change provider/protocol; the complete final configuration is validated.",
        "Always-restart originals and ambiguous mounted WireGuard sources block unsafe managed edits. Missing dependency metadata fails closed within existing access bounds; explicit host/domain names and stable VPN roles survive recreation.",
        "Expired unreferenced plans can be pruned; confirmed stopped-original cleanup protects volumes and active identities. Original-only manual recovery completion uses fresh checks and an opaque expiring review token without Docker writes or replay.",
        "Observed non-secret settings prefill selected stacks. Complete Host Compose review exports preserve unrelated fields and never expose stored credentials or imply deployment readiness."
