    {
      "id": "RETENTION-001",
      "title": "Bounded local history and confirmed draft deletion",
      "priority": "high",
      "acceptance": [
        "Audit events are automatically limited to 90 days and the newest 10000 entries on startup, insertion and maintenance. Existing session deadlines and bounded fail-closed rate limiters remain enforced.",
        "Drafts are never automatically deleted. New saves are atomically refused above 1000 records or 25 MiB of serialized input/output UTF-8 bytes; existing over-limit drafts remain accessible.",
