{
  "schema_version": 1,
  "application": {
    "id": "tuniku",
    "name": "Tuniku",
    "family": "ishiku",
    "locale": "en"
  },
  "summary": "Provide a secure dashboard for Gluetun Control Server functions and a generation-only Compose assistant.",
  "requirements": [
    {
      "id": "CORE-001",
      "title": "Core product behavior",
      "priority": "critical",
      "acceptance": [
        "Provide a secure dashboard for Gluetun Control Server functions and a generation-only Compose assistant.",
        "Existing documented and reachable behavior remains available unless an approved migration decision says otherwise."
      ],
      "security_critical": false
    },
    {
      "id": "AUTH-001",
      "title": "Secure account access",
      "priority": "critical",
      "acceptance": [
        "Account authentication uses generic errors, rate limits, and a supported password hash.",
        "Sessions are server-side revocable, rotated, idle- and absolute-time-bounded, cookie-protected, and CSRF-protected.",
        "Administrators can inspect their current session, confirm their password, and revoke other sessions; authentication and audit errors carry a request ID."
      ],
      "security_critical": true
    },
    {
      "id": "SETUP-001",
      "title": "Consistent first-run deployment",
      "priority": "critical",
      "acceptance": [
        "The primary ZimaOS Compose exposes exactly one operator-provided ISHIKU_SETUP_SECRET with a minimum length of 32 characters.",
        "The primary Compose sets HTTPS_ONLY=false so trusted-LAN HTTP works by default; HTTPS_ONLY=true enables Secure session cookies for reverse-proxy HTTPS.",
        "Tuniku generates and persists internal session and credential-encryption keys under /data without exposing them as additional new-install Compose fields.",
        "Legacy file-backed and environment secret overrides remain compatible, and existing encrypted credentials have an explicit migration warning."
      ],
      "security_critical": true
    },
    {
      "id": "BOOTSTRAP-001",
      "title": "First start without Gluetun configuration",
      "priority": "critical",
      "acceptance": [
        "The primary ZimaOS deployment contains the Tuniku application and a narrowly allow-listed internal Docker observer helper, but no Gluetun service, provider field, or VPN credential field.",
        "After administrator creation, the empty state offers both generation of a new Gluetun Compose proposal and connection to an existing Gluetun Control Server.",
        "The new-configuration proposal is a separate Gluetun-only add-on that joins the existing external tuniku network and cannot duplicate Tuniku or host port 65001.",
        "Compose generation is authenticated and generation-only; the Tuniku application does not mount the Docker socket, modify host Compose files, or claim that runtime Control Server routes can apply startup provider settings.",
        "Preconfigured deployments and existing Gluetun connections remain compatible, and Tuniku health never depends on Gluetun health."
      ],
      "security_critical": true
    },
    {
      "id": "ASSISTANT-001",
      "title": "Guided standalone Gluetun configuration",
      "priority": "critical",
      "acceptance": [
        "The authenticated assistant offers the provider catalog accepted by qmcgaw/gluetun:latest and only offers protocols supported natively by the selected provider.",
        "The assistant guides operators through provider- and protocol-specific required connection fields, supported provider options, server filters, and Control Server authentication, with server-side validation of the same constraints.",
        "Server filters use searchable values derived from the official qdm12/gluetun-servers data, retain a bundled offline snapshot, and can be refreshed without starting a production Gluetun container.",
        "Generated Gluetun services use qmcgaw/gluetun:latest, a Docker-managed /gluetun volume, no network_mode override, and syntactically validated Compose.",
        "Generated Compose uses direct scalar values and has no dependency on an env file; an env artifact remains an optional convenience export.",
        "Sensitive values are redacted by default and appear in generated output only after an explicit per-generation opt-in; drafts, logs, audits, and inspected input remain redacted, and the browser removes a secret-bearing result after 15 minutes.",
        "For an already running Tuniku installation, the primary generated artifact contains only Gluetun and joins the existing external Docker network named tuniku instead of duplicating Tuniku or host port 65001.",
        "The assistant and generated result do not create page-level horizontal overflow at supported compact, medium, expanded, wide, or 200 percent zoom layouts; code can scroll inside its own region."
      ],
      "security_critical": true
    },
    {
      "id": "DIAG-001",
      "title": "Gluetun failure diagnostics",
      "priority": "critical",
      "acceptance": [
        "Tuniku remains available when Gluetun is missing, stopped, restarting, unhealthy, or exited.",
        "Authenticated diagnostics show Gluetun state, health, exit code, restart count, start and finish timestamps, bounded redacted Docker logs, and recognizable provider or network configuration problems.",
        "Diagnostics use Docker list, inspect, and logs operations through a dedicated internal allow-listed helper and never depend on docker exec or a shell inside Gluetun.",
        "Published Gluetun Docker ports are detected through the same helper, and a missing helper gives actionable full-Compose redeployment guidance instead of exposing a resolver error.",
        "VPN-provider port forwarding and Docker-published ports are labeled separately, port inspection falls back to configured Docker bindings for stopped containers, and detection refreshes without signing in again.",
        "The Tuniku application never mounts the Docker socket, the observer has no externally published port, and no Docker mutation route is exposed."
      ],
      "security_critical": true
    },
    {
      "id": "TRAFFIC-001",
      "title": "Privacy-preserving aggregate VPN traffic accounting",
      "priority": "high",
      "acceptance": [
        "When the optional Docker observer is present, Tuniku displays aggregate Gluetun download and upload rates, current-day totals, and a rolling 90-day tracked total.",
        "Counters come from a fixed read-only Docker Stats operation and do not record destinations, URLs, DNS queries, packet contents, or credentials.",
        "Counter resets and Gluetun container replacements do not create false deltas, daily aggregates persist across Tuniku restarts, and traffic polling never affects Tuniku or Gluetun availability.",
        "When counters cannot be sampled, the Overview reports an actionable observer, container-state, or Docker-stats reason instead of silently showing an unavailable value.",
        "The interface and documentation state that shared-network services are aggregated and cannot be reliably separated per application."
      ],
      "security_critical": true
    },
    {
      "id": "UI-001",
      "title": "Consistent English interface",
      "priority": "high",
      "acceptance": [
        "All user-facing interface text is English.",
        "The app uses ishiku semantic tokens, shared layout contracts, responsive behavior, and WCAG 2.2 AA interaction.",
        "The wide Overview gives long IP, port, and traffic values sufficient card width and displays optional country, region, and city metadata returned by Gluetun without calling another geolocation service.",
        "Browser, PWA, launcher, catalog, and in-app consumers use the approved Tuniku icon family."
      ],
      "security_critical": false
    },
    {
      "id": "OPS-001",
      "title": "Safe standalone operation",
      "priority": "high",
      "acceptance": [
        "A fresh clone can build, test, and run without the outer workspace.",
        "Health checks, persistent data, runtime secrets, backup, restore, and upgrade procedures are verifiable.",
        "The primary ZimaOS Compose uses direct scalar values, the standard application metadata, and persistent host paths while publishing assigned host port 65001 to container port 8080."
      ],
      "security_critical": true
    },
    {
      "id": "REL-001",
      "title": "Reproducible release",
      "priority": "high",
      "acceptance": [
        "Pull requests and releases use clone-local verification scripts.",
        "Released images are immutable, scanned, SBOM-equipped, provenance-attested, and rollback-documented.",
        "GHCR latest promotion is gated on full verification of the same commit."
      ],
      "security_critical": true
    }
  ]
}
