appspec:
  schema_version: "1.0.0"
  document:
    id: "tuniku-appspec"
    title: "Tuniku Application Specification"
    language: "de"
    priority: "machine_readability_over_style"
    status: "implementation_ready"
    generated_for: "ChatGPT Codex or equivalent coding agent"
    source_of_truth:
      functional_requirements: "this appspec"
      design_system: "pixel_design.yaml"
      visual_references:
        - "palette.png"
        - "components.png"
        - "menu.png"
        - "mockup_mobile.png"
        - "mockup_desktop.png"
    conflict_resolution:
      - "Explicit requirements in this appspec override inferred implementation choices."
      - "pixel_design.yaml is canonical for visual and interaction design."
      - "When a Gluetun feature or configuration name depends on the installed Gluetun version, do not invent unsupported environment variables or API endpoints."
      - "Unknown or version-dependent behavior must be surfaced as unsupported, unavailable, or requiring documentation verification."

  identity:
    app_id: "tuniku"
    name: "Tuniku"
    subtitle: "Gluetun Web Interface"
    family: "ishiku"
    category:
      - "self-hosted utility"
      - "VPN control dashboard"
      - "Docker Compose assistant"
    app_symbol:
      preferred_material_symbols:
        - "explore"
        - "vpn_lock"
        - "route"
      rule: "Use the supplied Tuniku app asset when present; otherwise use one logical rounded symbol consistently."
    product_statement: >-
      Tuniku is a self-hosted web interface for observing and controlling supported
      Gluetun Control Server functions and for generating precise, manual Docker
      Compose instructions for Gluetun deployments.

  product_definition:
    is:
      - "Gluetun Web Interface"
      - "Gluetun Control Dashboard"
      - "Gluetun Compose Assistant"
      - "Gluetun Port Overview"
      - "Gluetun Setup Helper"
    is_not:
      - "Portainer replacement"
      - "qBittorrent manager"
      - "Sonarr, Radarr, Prowlarr, or media-stack manager"
      - "container orchestrator"
      - "automatic Compose editor"
      - "VPN routing autopilot for foreign containers"
      - "credential manager for multiple unrelated applications"
      - "general Docker administration interface"
    central_rule: >-
      Tuniku may actively call allow-listed Gluetun Control Server functions, but it
      must never automatically alter Docker Compose files, redeploy stacks, mutate
      foreign containers, or route other applications behind Gluetun.

  scope:
    version_1:
      primary_instance_count: 1
      multi_instance_preparation:
        required: true
        behavior: >-
          The UI exposes one active Gluetun instance in version 1, while persistence,
          service interfaces, and routing must use an instance identifier so that
          multiple instances can be added later without a destructive migration.
      deployment_targets:
        - "Docker Compose"
        - "ZimaOS Compose stacks"
        - "generic local self-hosted Docker environments"
      supported_form_factors:
        - "mobile browser"
        - "tablet browser"
        - "desktop browser"
    excluded_from_version_1:
      - "automatic Docker Compose writes"
      - "automatic stack redeploy"
      - "automatic container recreation"
      - "automatic network_mode changes"
      - "management of qBittorrent, Sonarr, Radarr, Prowlarr, or other app APIs"
      - "live switching of foreign containers between normal networking and Gluetun"
      - "multi-host Docker orchestration"
      - "Kubernetes support"

  architecture:
    required_topology: |
      tuniku  ->  gluetun-control-server
      gluetun ->  provides VPN connectivity
      other app containers -> may be manually placed behind Gluetun through Compose
    service_boundaries:
      tuniku:
        responsibilities:
          - "Serve authenticated web UI and internal API."
          - "Read supported state from the Gluetun Control Server."
          - "Execute explicitly allow-listed Gluetun control actions."
          - "Generate Compose, .env, and Docker Secret instructions."
          - "Store local Tuniku preferences, labels, drafts, and audit metadata."
        prohibited:
          - "Mutating foreign containers."
          - "Writing or mounting a host Compose file as writable."
          - "Starting, stopping, recreating, or restarting Docker containers through Docker."
          - "Editing qBittorrent, Sonarr, Radarr, Prowlarr, or any unrelated application."
      gluetun:
        responsibilities:
          - "Establish and maintain VPN connectivity."
          - "Expose the Gluetun Control Server when configured by the user."
          - "Publish ports required by applications sharing its network namespace."
      foreign_app_containers:
        responsibilities:
          - "Remain independently configured and operated."
          - "Use network_mode: service:gluetun only after a manual Compose change by the user."
        managed_by_tuniku: false
    communication:
      tuniku_to_gluetun:
        protocol: "HTTP or HTTPS according to user configuration"
        endpoint_source: "configured Gluetun Control Server base URL"
        auth_modes:
          - "none, only when intentionally configured in a trusted local network"
          - "API key when supported by the selected Gluetun configuration"
          - "Basic Auth when supported by the selected Gluetun configuration"
        timeouts:
          connect_seconds: 5
          request_seconds: 15
        retry_policy:
          read_requests: "maximum 2 retries with short bounded backoff"
          write_or_control_requests: "no blind retry unless operation is proven idempotent"
      optional_docker_observation:
        enabled_by_default: false
        purpose:
          - "Detect Gluetun container metadata."
          - "Read exposed ports, health state, environment variable names with secret values redacted, and network metadata where safely available."
          - "Improve current-configuration explanations."
        preferred_method: "restricted Docker Socket Proxy with read-only allow-list"
        raw_docker_socket:
          allowed: false
          exception: >-
            Only permit as an explicitly documented advanced deployment choice when
            no restricted proxy is available; the application itself must still
            perform read-only operations and expose a high-risk warning.
        forbidden_operations:
          - "container start"
          - "container stop"
          - "container restart"
          - "container update"
          - "container create"
          - "container delete"
          - "network connect or disconnect"
          - "volume mutation"
          - "exec"
          - "image pull or delete"

  technology_policy:
    repository_behavior:
      existing_repository: "Preserve the existing stack and conventions unless technically impossible."
      greenfield_recommendation:
        frontend: "TypeScript-based responsive web frontend"
        backend: "Typed server application with REST API and background polling"
        persistence: "SQLite by default with migration support"
    implementation_requirements:
      - "Separate frontend presentation, Tuniku domain logic, Gluetun adapter, Compose generation, persistence, and authentication concerns."
      - "Use a typed Gluetun adapter instead of scattering raw endpoint calls through controllers or UI components."
      - "Use an allow-list for all mutating Gluetun actions."
      - "Validate generated YAML before presenting it as valid."
      - "Do not require external SaaS services."
      - "Do not include telemetry by default."

  authentication:
    required: true
    account_model: "local Tuniku accounts"
    version_1_roles:
      - id: "admin"
        permissions: "all Tuniku functions"
    first_run:
      behavior: "Show registration flow immediately when no admin account exists."
      registration_secret:
        source: "Docker environment variable or Docker Secret configured before startup"
        required: true
        one_time_use: true
        comparison_rule: "The admin password must not equal the registration secret."
      completion:
        - "Create the first admin account."
        - "Invalidate first-run registration for normal operation."
        - "Never display the registration secret after validation."
    sessions:
      storage: "secure server-side session or equivalent hardened session design"
      cookie_requirements:
        - "HttpOnly"
        - "SameSite=Lax or stricter"
        - "Secure when served through HTTPS"
      csrf_protection: true
      login_rate_limit: true
      password_hashing: "Argon2id or an equivalently modern password hashing algorithm"

  gluetun_instance_configuration:
    visible_fields:
      - "display name"
      - "Control Server base URL"
      - "authentication mode"
      - "API key or Basic Auth username/password when selected"
      - "TLS certificate verification"
      - "request timeout"
    defaults:
      display_name: "Gluetun"
      tls_verification: true
    connection_test:
      required: true
      results:
        - "reachable"
        - "authentication accepted"
        - "detected capabilities"
        - "detected Gluetun or API version when exposed"
        - "unsupported or inaccessible endpoints"
      secret_output: "always redacted"
    persistence:
      base_url: "persist"
      non_secret_preferences: "persist"
      credentials:
        default: "do not persist"
        optional_save: "allowed only with explicit user consent and encrypted-at-rest storage"
        display: "always masked"

  gluetun_control_capabilities:
    adapter_rules:
      - "Discover or infer capabilities from actual successful API responses where possible."
      - "Hide or disable controls that the connected Gluetun version does not support."
      - "Never simulate success for unavailable endpoints."
      - "All state-changing actions require an authenticated Tuniku admin session."
      - "Control actions must be logged without secret values."
    read_operations:
      vpn_status:
        required: true
      public_ip:
        required: true
      dns_status:
        required: true
      updater_status:
        required: true
      port_forwarding_status:
        required: true
      port_forwarding_values:
        required: true
      vpn_settings_redacted:
        required: true
        redaction_required: true
    control_operations:
      vpn_start:
        required: true
        confirmation: true
      vpn_stop:
        required: true
        confirmation: true
        warning: "Stopping the VPN can interrupt applications that share Gluetun networking. Tuniku will not restart those applications."
      dns_start:
        required_if_supported: true
        placement: "Advanced section"
        confirmation: true
      dns_stop:
        required_if_supported: true
        placement: "Advanced section"
        confirmation: true
      updater_start:
        required_if_supported: true
        confirmation: false
      port_forwarding_change:
        required_if_supported: true
        confirmation: true
        validation: "Validate protocol, range, provider support, and current API capability before submission."
    explicitly_forbidden_live_changes:
      - "VPN provider change"
      - "VPN type change"
      - "WireGuard credentials write"
      - "OpenVPN credentials write"
      - "server country, region, or city change when it requires Compose reconfiguration"
      - "Control Server authentication reconfiguration"
      - "published Docker port changes"
      - "Docker Secret changes"
      - "foreign container network changes"

  polling_and_state:
    overview_poll_interval_seconds: 10
    background_tab_poll_interval_seconds: 60
    action_follow_up:
      behavior: "Poll until a terminal state or timeout after a start, stop, DNS, updater, or port-forwarding action."
      timeout_seconds: 60
    stale_state:
      threshold_seconds: 45
      ui_behavior: "Show last-updated timestamp and a visible stale-data warning."
    failure_behavior:
      - "Retain the last known state but clearly mark it stale."
      - "Do not render an offline state as a successful stopped state."
      - "Differentiate timeout, DNS failure, TLS failure, unauthorized, forbidden, unsupported, and schema mismatch."

  compose_assistant:
    required: true
    write_behavior: "generation_only"
    automatic_host_writes: false
    automatic_redeploy: false
    entry_modes:
      - id: "new_gluetun_setup"
        label: "New Gluetun setup"
      - id: "enable_control_server"
        label: "Enable Control Server"
      - id: "configure_control_auth"
        label: "Configure Control Server authentication"
      - id: "configure_provider"
        label: "Configure VPN provider and VPN type"
      - id: "configure_wireguard"
        label: "Prepare WireGuard configuration"
      - id: "configure_openvpn"
        label: "Prepare OpenVPN configuration"
      - id: "set_server_selection"
        label: "Set server country, region, or city"
      - id: "publish_app_port"
        label: "Publish an app port on Gluetun"
      - id: "route_app_manually"
        label: "Place an app behind Gluetun manually"
      - id: "migrate_secrets"
        label: "Move plaintext values to Docker Secrets"
      - id: "review_existing_configuration"
        label: "Review an existing configuration"
    configuration_sources:
      control_api_detection:
        enabled: true
        limitation: "Only values exposed by the API can be detected."
      docker_read_only_detection:
        enabled_when_configured: true
        limitation: "Secret values must never be returned or persisted."
      manual_paste:
        enabled: true
        accepted_content:
          - "Compose YAML"
          - ".env text"
        default_persistence: false
        rules:
          - "Parse defensively."
          - "Do not execute anchors, templates, commands, or substitutions."
          - "Treat pasted content as untrusted data."
          - "Redact detected secret values in normal review views."
      manual_form:
        enabled: true
    supported_configuration_topics:
      - "VPN provider"
      - "VPN type"
      - "WireGuard data"
      - "OpenVPN data"
      - "server countries"
      - "server regions"
      - "server cities"
      - "Control Server activation"
      - "Control Server authentication"
      - "API key"
      - "Basic Auth"
      - "firewall and port-forwarding ports"
      - "published ports on the Gluetun service"
      - "Docker Secrets"
      - "environment variables"
      - "volumes"
      - "healthchecks"
      - "network_mode for application containers"
      - "ZimaOS Compose stack instructions"
    provider_handling:
      preset_catalog:
        allowed: true
        requirement: >-
          Provider-specific schemas must be versioned, testable, and sourced from
          supported Gluetun configuration knowledge. Do not fabricate variable names.
      custom_mode:
        required: true
        purpose: "Permit advanced users to enter supported environment keys not covered by a bundled preset."
      version_warning: "Generated settings can depend on the installed Gluetun version and provider."
    wizard_behavior:
      - "Ask only relevant questions based on the selected task, provider, VPN type, and detected capabilities."
      - "Allow moving backward without losing non-secret entries."
      - "Do not retain secret form values after browser reload unless the user explicitly saves them."
      - "Validate host ports, container ports, protocols, duplicate entries, YAML syntax, and required dependencies."
      - "Show a summary before generation."
    required_output_sections:
      - id: "detected_configuration"
        number: 1
        title: "Aktuelle erkannte Konfiguration"
        behavior: "Show only values that are actually detected or manually supplied; mark unknown values as unknown."
      - id: "recommended_change"
        number: 2
        title: "Empfohlene Änderung"
        behavior: "Explain exactly what should change and why."
      - id: "copy_paste_snippet"
        number: 3
        title: "Copy-Paste-Snippet"
        behavior: "Generate valid Compose, environment, .env, or Docker Secret content."
      - id: "manual_steps"
        number: 4
        title: "Manuelle Schritte"
        behavior: "List file edits, secret file creation, validation, stack redeploy, and post-deploy checks in order."
      - id: "security_warning"
        number: 5
        title: "Sicherheitswarnung"
        behavior: "Explain plaintext, repository, permission, Docker socket, exposed Control Server, or TLS risks."
    generated_artifacts:
      copy_buttons: true
      download_buttons: true
      formats:
        - id: "compose_example"
          filename: "docker-compose.example.yml"
        - id: "env_example"
          filename: ".env.example"
        - id: "secret_manifest"
          filename: "secrets.README.txt"
        - id: "manual_steps"
          filename: "tuniku-manual-steps.md"
      validation:
        yaml_parse_required: true
        unresolved_placeholders_detected: true
        duplicate_port_detection: true
        unsafe_plaintext_detection: true
    snippet_views:
      tabs:
        - "Compose"
        - ".env"
        - "Secrets"
        - "Steps"
      code_font: "monospace"
      line_numbers: true
      copy_feedback: "toast"
      redacted_preview_default: true
      full_secret_preview:
        explicit_opt_in: true
        warning_text: "Dieses Snippet enthält sensible Werte. Speichere es nicht öffentlich und lade es nicht in ein öffentliches Repository hoch."
        auto_revert_to_redacted_minutes: 15

  secret_handling:
    principles:
      - "Prefer Docker Secret files over plaintext environment values."
      - "Use sensitive input only for the requested generation task by default."
      - "Never write secret values to application logs, audit metadata, analytics, exception traces, browser localStorage, or URLs."
      - "Never send secrets to external services."
      - "Always mask persisted secret values."
    sensitive_fields:
      - "WireGuard Private Key"
      - "OpenVPN username"
      - "OpenVPN password"
      - "Gluetun API key"
      - "Control Server Basic Auth username"
      - "Control Server Basic Auth password"
      - "provider-specific IDs"
      - "provider-specific tokens"
    default_lifecycle:
      browser_state: "memory only"
      backend_state: "request scope only"
      persistence: false
      clipboard: "only after explicit copy action"
    optional_persistence:
      allowed: true
      requires:
        - "explicit save action"
        - "clear local-storage explanation"
        - "encryption at rest"
        - "ability to delete the stored credential"
      encryption_key_source: "Docker Secret or dedicated environment secret, never hardcoded"
    generated_secret_files:
      file_permissions_guidance: "0600 where supported"
      repository_guidance:
        - "Add real secret files to .gitignore."
        - "Commit only .example files with placeholders."
    logging_redaction:
      key_name_patterns:
        - "PASSWORD"
        - "TOKEN"
        - "SECRET"
        - "PRIVATE_KEY"
        - "API_KEY"
        - "AUTH"
      value_redaction: "Replace with [REDACTED]."

  manual_app_routing_guide:
    required: true
    interaction_with_foreign_apps: false
    core_example: |
      services:
        app:
          image: example/app
          network_mode: "service:gluetun"
    required_explanations:
      - "The app container uses Gluetun's network namespace."
      - "The app container does not receive its own normal Docker network connection in this mode."
      - "The app's web ports must be published on the Gluetun service."
      - "If the app listens internally on port 8080, Gluetun must publish the required host-to-container mapping."
      - "Live switching between normal networking and Gluetun networking is not supported."
      - "The Compose stack must be edited and redeployed manually."
      - "Tuniku does not inspect, configure, restart, or authenticate to the foreign application."
    port_example: |
      services:
        gluetun:
          ports:
            - "8080:8080" # qBittorrent WebUI
    label_semantics: >-
      A label such as qBittorrent WebUI is local descriptive metadata in Tuniku only.
      It does not create an integration with qBittorrent.
    warnings:
      - "Some applications require additional networks or service discovery that is unavailable with network_mode: service:gluetun."
      - "Published ports can expose web interfaces beyond the intended network if the host binding is too broad."
      - "The user must verify firewall and bind-address behavior."

  port_overview:
    required: true
    data_sources:
      - "Gluetun Control Server port-forwarding state"
      - "optional read-only Docker port inspection"
      - "manual Tuniku entries"
    port_types:
      - "VPN provider forwarded ports"
      - "host-published Gluetun ports"
      - "planned ports from Compose Assistant drafts"
    local_labels:
      supported: true
      examples:
        - "qBittorrent WebUI"
        - "Application API"
        - "Temporary test port"
      storage: "Tuniku local database"
      foreign_app_integration: false
    fields:
      - "label"
      - "host address when known"
      - "host port"
      - "container port"
      - "protocol"
      - "source"
      - "status"
      - "last checked"
      - "notes"
    actions:
      - "copy Compose port line"
      - "open Compose Assistant prefilled"
      - "edit local label"
      - "remove local manual entry"
      - "request supported Gluetun port-forwarding change"
    validation:
      - "duplicate host port"
      - "invalid port range"
      - "unknown protocol"
      - "collision inside current draft"
      - "port is only labeled locally and not confirmed as published"

  user_interface:
    design_system:
      name: "Pixel Soft Utility"
      required_file: "pixel_design.yaml"
      themes:
        - "Lavender"
        - "Mint"
        - "Sky"
        - "Amber"
        - "Graphite"
      modes:
        - "System"
        - "Light"
        - "Dark"
      persistence_keys:
        theme: "tuniku-theme"
        mode: "tuniku-mode"
      app_specific_accent_color: false
    navigation:
      desktop:
        pattern: "left navigation rail plus calm top bar"
        sections:
          - id: "overview"
            label: "Overview"
            icon: "dashboard"
          - id: "control"
            label: "VPN Control"
            icon: "vpn_lock"
          - id: "ports"
            label: "Ports"
            icon: "lan"
          - id: "compose_assistant"
            label: "Compose Assistant"
            icon: "code_blocks"
        secondary_entry: "three-dot overflow menu for Settings, About, Documentation, and Sign out"
      mobile:
        pattern: "top app bar plus floating bottom navigation"
        sections:
          - id: "overview"
            label: "Overview"
            short_label: "Overview"
            icon: "dashboard"
          - id: "control"
            label: "VPN"
            short_label: "VPN"
            icon: "vpn_lock"
          - id: "ports"
            label: "Ports"
            short_label: "Ports"
            icon: "lan"
          - id: "compose_assistant"
            label: "Assistant"
            short_label: "Assistant"
            icon: "code_blocks"
        settings_entry: "three-dot overflow opens a rounded bottom sheet"
    header:
      contents:
        - "Tuniku app symbol"
        - "Tuniku"
        - "Gluetun Web Interface as a small subtitle where space permits"
        - "spacer"
        - "profile/avatar button when authenticated"
        - "three-dot overflow"
      prohibited:
        - "VPN state chip"
        - "public IP"
        - "API state"
        - "version"
        - "build date"
        - "Git SHA"
        - "primary VPN start or stop action"
    overview_page:
      hero_card:
        primary_content:
          - "VPN state"
          - "connection health"
          - "server location when available"
          - "last successful update"
        primary_action: "Open VPN Control"
      contextual_cards:
        - id: "public_ip"
          content: "current public IP, country or ASN only when available, last checked"
          copy_action: true
        - id: "dns"
          content: "DNS status and resolver summary"
        - id: "port_forwarding"
          content: "forwarding status and active ports"
        - id: "updater"
          content: "updater state and last run"
        - id: "control_server"
          content: "Control Server reachability and authentication status"
      recent_activity:
        content: "recent Tuniku control actions and generation events with secrets redacted"
    vpn_control_page:
      sections:
        - "VPN status card"
        - "Start and Stop controls"
        - "Public IP refresh"
        - "redacted current VPN settings"
        - "Updater control"
        - "Advanced DNS controls"
      interaction_rules:
        - "Start and Stop are contextual filled or tonal actions inside the main card, never in the global header."
        - "Destructive or connectivity-impacting actions require a confirmation dialog."
        - "Show progress and post-action verification."
    ports_page:
      desktop: "calm table with filters and a detail side sheet"
      mobile: "stacked rounded port cards"
      filters:
        - "All"
        - "Forwarded"
        - "Published"
        - "Planned"
        - "Warning"
      empty_state: "Explain how to add a manual port label or start the Compose Assistant."
    compose_assistant_page:
      layout:
        desktop: "stepper or section rail on the left, form in the center, generated output panel on the right or below"
        mobile: "single-column step flow with sticky contextual Next/Generate action above safe area"
      components:
        - "task selector cards"
        - "segmented controls"
        - "provider and VPN type inputs"
        - "secret input fields with reveal controls"
        - "validation summaries"
        - "five required output sections"
        - "code tabs"
        - "copy and download actions"
      do_not_use: "marketing-style onboarding illustrations"
    settings_about_admin:
      entry: "three-dot overflow"
      mobile: "rounded bottom sheet"
      desktop: "right side sheet"
      sections:
        appearance:
          - "mode selector"
          - "theme selector"
          - "reduce motion"
        connection:
          - "Gluetun instance URL"
          - "authentication mode"
          - "connection test"
          - "optional credential storage"
        app_info:
          - "app version"
          - "build date"
          - "GitHub SHA"
        admin_info:
          - "Tuniku service status"
          - "Gluetun adapter status"
          - "last successful API call"
          - "database status"
          - "diagnostics"
          - "logs"
        advanced:
          - "Docker observation status"
          - "clear saved Gluetun credential"
          - "delete compose drafts"
          - "reset local appearance settings"
          - "copy debug details"
    responsive_behavior:
      mobile:
        - "Single-column app-like layout."
        - "Minimum 44px touch targets."
        - "No desktop tables."
        - "Use bottom sheets for settings and focused detail actions."
        - "Keep bottom navigation above safe-area inset."
      desktop:
        - "Balanced dashboard density."
        - "Maximum content width follows pixel_design.yaml."
        - "Use navigation rail, card grid, tables where useful, and right side sheets."
      accessibility:
        - "WCAG AA target."
        - "Visible keyboard focus."
        - "All icon buttons require accessible labels."
        - "Color is never the only state indicator."
        - "Respect prefers-reduced-motion."

  data_model:
    storage_engine_default: "SQLite"
    entities:
      user:
        fields:
          - "id"
          - "username"
          - "password_hash"
          - "role"
          - "created_at"
          - "last_login_at"
      gluetun_instance:
        fields:
          - "id"
          - "display_name"
          - "base_url"
          - "auth_mode"
          - "encrypted_credential_reference nullable"
          - "tls_verify"
          - "request_timeout_seconds"
          - "capability_cache_json"
          - "last_connected_at nullable"
          - "created_at"
          - "updated_at"
      stored_secret:
        fields:
          - "id"
          - "instance_id"
          - "secret_type"
          - "encrypted_payload"
          - "created_at"
          - "updated_at"
        default_usage: "disabled unless explicitly requested by user"
      local_port_label:
        fields:
          - "id"
          - "instance_id"
          - "label"
          - "host_address nullable"
          - "host_port nullable"
          - "container_port"
          - "protocol"
          - "source_type"
          - "notes nullable"
          - "created_at"
          - "updated_at"
      compose_draft:
        fields:
          - "id"
          - "instance_id"
          - "title"
          - "task_type"
          - "non_secret_input_json"
          - "generated_output_redacted"
          - "contains_secret_values boolean"
          - "created_at"
          - "updated_at"
        persistence_rule: "Do not persist raw secret values in drafts."
      audit_event:
        fields:
          - "id"
          - "user_id"
          - "instance_id nullable"
          - "event_type"
          - "result"
          - "redacted_metadata_json"
          - "created_at"
        retention_default_days: 30
    migration_requirements:
      - "Version all database migrations."
      - "Back up the database before destructive migrations."
      - "Preserve instance identifiers for future multi-instance support."

  internal_api:
    style: "versioned REST or equivalent typed internal API"
    base_path: "/api/v1"
    endpoints:
      auth:
        - "POST /auth/register-first-admin"
        - "POST /auth/login"
        - "POST /auth/logout"
        - "GET /auth/session"
      instance:
        - "GET /instances"
        - "GET /instances/{instance_id}"
        - "PUT /instances/{instance_id}"
        - "POST /instances/{instance_id}/test"
        - "DELETE /instances/{instance_id}/stored-credential"
      status:
        - "GET /instances/{instance_id}/overview"
        - "GET /instances/{instance_id}/capabilities"
        - "GET /instances/{instance_id}/vpn"
        - "GET /instances/{instance_id}/public-ip"
        - "GET /instances/{instance_id}/dns"
        - "GET /instances/{instance_id}/updater"
        - "GET /instances/{instance_id}/port-forwarding"
        - "GET /instances/{instance_id}/settings-redacted"
      control:
        - "POST /instances/{instance_id}/vpn/start"
        - "POST /instances/{instance_id}/vpn/stop"
        - "POST /instances/{instance_id}/dns/start"
        - "POST /instances/{instance_id}/dns/stop"
        - "POST /instances/{instance_id}/updater/start"
        - "PUT /instances/{instance_id}/port-forwarding"
      ports:
        - "GET /instances/{instance_id}/ports"
        - "POST /instances/{instance_id}/port-labels"
        - "PUT /instances/{instance_id}/port-labels/{label_id}"
        - "DELETE /instances/{instance_id}/port-labels/{label_id}"
      compose_assistant:
        - "POST /compose/inspect"
        - "POST /compose/validate"
        - "POST /compose/generate"
        - "POST /compose/redact"
        - "GET /compose/drafts"
        - "POST /compose/drafts"
        - "DELETE /compose/drafts/{draft_id}"
      diagnostics:
        - "GET /admin/diagnostics"
        - "GET /admin/logs"
        - "GET /admin/debug-details"
    control_endpoint_requirements:
      - "Require authenticated admin session."
      - "Apply CSRF protection."
      - "Enforce capability check."
      - "Validate request body strictly."
      - "Write a redacted audit event."
      - "Return actual upstream result, not optimistic success."

  compose_generation_rules:
    general:
      - "Generated YAML must be valid YAML."
      - "Use explicit placeholders in .example files."
      - "Never silently drop unknown existing Compose keys."
      - "When reviewing pasted Compose, generate a proposed fragment or diff rather than pretending to have edited the source file."
      - "Preserve comments only when the parser and renderer can do so reliably; otherwise explain that comments may be omitted from generated fragments."
      - "Quote network_mode values such as service:gluetun."
      - "Make host port binding explicit."
    compose_output_modes:
      - "complete example stack"
      - "service fragment"
      - "environment fragment"
      - "ports fragment"
      - "secrets fragment"
      - "manual patch instructions"
    control_server_setup:
      required_fields:
        - "listen address"
        - "published port when remote browser access is required"
        - "authentication mode"
        - "credential source"
      warning: "Do not expose an unauthenticated Control Server to an untrusted network."
    application_routing:
      required_fragment: |
        services:
          app:
            image: example/app
            network_mode: "service:gluetun"
      required_gluetun_port_fragment: |
        services:
          gluetun:
            ports:
              - "8080:8080" # Local label only
      manual_steps:
        - "Edit the Compose stack."
        - "Move or add published ports to the Gluetun service."
        - "Remove conflicting ports from the app service if required."
        - "Redeploy or recreate the affected services manually."
        - "Verify the app web interface and public IP behavior."
    secrets_preference:
      preferred_example: |
        services:
          gluetun:
            secrets:
              - wireguard_private_key
              - gluetun_api_key

        secrets:
          wireguard_private_key:
            file: ./secrets/wireguard_private_key.txt
          gluetun_api_key:
            file: ./secrets/gluetun_api_key.txt
      warning: "The exact environment or file binding required by Gluetun must match the selected Gluetun version and supported configuration keys."

  security:
    threat_model:
      protected_assets:
        - "Gluetun Control Server credentials"
        - "VPN provider credentials"
        - "WireGuard private keys"
        - "OpenVPN credentials"
        - "generated snippets containing secrets"
        - "Tuniku admin sessions"
        - "local deployment topology"
      primary_risks:
        - "secret leakage through logs, drafts, browser storage, URLs, or public repositories"
        - "unauthorized VPN start or stop"
        - "exposed unauthenticated Gluetun Control Server"
        - "overprivileged Docker socket access"
        - "malicious pasted YAML"
        - "host port accidentally bound to all interfaces"
    requirements:
      - "Bind Tuniku according to explicit deployment configuration; do not assume public exposure is safe."
      - "Recommend reverse-proxy HTTPS for access outside a trusted local network."
      - "Use a restrictive Content Security Policy."
      - "Escape all rendered configuration and log text."
      - "Do not execute pasted configuration."
      - "Do not allow arbitrary upstream URLs per request; use configured instance URLs to reduce SSRF risk."
      - "Block loopback, link-local, metadata, or unexpected destinations unless explicitly required by the configured local instance and safely validated."
      - "Mask Authorization headers and credentials in errors."
      - "Limit log download and diagnostics to admins."
      - "Add no shell execution path for Compose generation."
      - "Use secure temporary files and delete them immediately after download generation."
    headers:
      - "Content-Security-Policy"
      - "X-Content-Type-Options: nosniff"
      - "Referrer-Policy"
      - "Permissions-Policy"
      - "frame-ancestors restriction through CSP"
    rate_limits:
      login: "strict"
      connection_test: "moderate"
      mutating_gluetun_actions: "strict per user and instance"
      compose_generation: "moderate with input-size limits"
    input_limits:
      pasted_compose_max_bytes: 1048576
      log_page_size_max: 500
      generated_download_max_bytes: 5242880

  observability:
    application_logs:
      format: "structured"
      secret_redaction: true
      default_level: "info"
      user_visible_logs:
        enabled: true
        admin_only: true
        default_retention_days: 7
    diagnostics:
      checks:
        - "Tuniku database"
        - "Gluetun Control Server connectivity"
        - "authentication"
        - "capability detection"
        - "optional Docker observation connection"
        - "write-protection verification"
        - "theme asset loading"
      copy_debug_details:
        redacted: true
        include:
          - "Tuniku version"
          - "build date"
          - "Git SHA"
          - "runtime version"
          - "database migration version"
          - "Gluetun endpoint host with credentials removed"
          - "detected capabilities"
          - "recent error codes"

  notifications:
    in_app:
      mechanisms:
        - "toast"
        - "inline banner"
        - "confirmation dialog"
      external_notifications: false
      reason: "No external notification service is required for version 1."

  docker_deployment:
    required_services:
      - "tuniku"
      - "gluetun"
    separation_required: true
    tuniku_mounts:
      required:
        - "persistent app data volume"
      optional:
        - "restricted Docker Socket Proxy endpoint"
      forbidden:
        - "writable host Compose file"
        - "writable Docker socket"
        - "foreign application configuration directories"
    tuniku_environment_contract:
      required:
        - "TUNIKU_REGISTRATION_SECRET or equivalent Docker Secret reference"
        - "TUNIKU_DATA_PATH"
        - "TUNIKU_SESSION_SECRET or equivalent Docker Secret reference"
      optional:
        - "TUNIKU_BASE_URL"
        - "TUNIKU_LOG_LEVEL"
        - "TUNIKU_TRUSTED_PROXY_COUNT"
        - "TUNIKU_DOCKER_PROXY_URL"
        - "TUNIKU_ENCRYPTION_KEY for optional stored credentials"
      rules:
        - "Provide .env.example with placeholders only."
        - "Support Docker Secrets for registration, session, and encryption secrets."
    healthcheck:
      required: true
      endpoint: "/health"
      behavior: "Report Tuniku process and database readiness; Gluetun availability is a dependency status, not a reason to mark the Tuniku process dead."
    restart_policy: "unless-stopped"
    non_root_runtime: true
    read_only_root_filesystem: "preferred when compatible with temporary download generation"

  zimaos_guidance:
    required: true
    content:
      - "Explain where to edit the Compose stack in ZimaOS."
      - "Explain that changes are applied by manually saving and redeploying the stack."
      - "Explain that Tuniku does not press deploy or recreate containers."
      - "Show how to create and mount local secret files."
      - "Show how to publish an app port on the Gluetun service."
      - "Show how to add network_mode: service:gluetun to a manually selected app service."
      - "Warn that ZimaOS UI terminology may differ by version."

  readme:
    required: true
    language: "English preferred, concise German notes allowed when repository convention requires"
    required_sections:
      - "Overview"
      - "What Tuniku is"
      - "What Tuniku is not"
      - "Architecture"
      - "Features"
      - "Security model"
      - "Installation"
      - "First-run registration"
      - "Connecting to Gluetun Control Server"
      - "Compose Assistant"
      - "Routing an app behind Gluetun manually"
      - "Docker Secrets"
      - "ZimaOS notes"
      - "Updating"
      - "Backup and restore"
      - "Troubleshooting"
      - "Development"
      - "Part of the ishiku family"
      - "Created with ChatGPT Codex"
      - "License"
    mandatory_boundary_text:
      - "Tuniku runs separately from Gluetun."
      - "Gluetun runs separately from qBittorrent and other applications."
      - "Other applications may be placed behind Gluetun manually through Docker Compose."
      - "Tuniku generates instructions and snippets but does not write Compose files automatically."
      - "Tuniku does not modify, restart, recreate, or manage foreign containers."
      - "Sensitive values may be entered locally for snippet generation."
      - "Secrets must not be committed to public repositories."
    architecture_diagram_required: true
    example_files:
      - "docker-compose.example.yml"
      - ".env.example"
      - "secrets/README.md"
    screenshot_policy:
      - "Do not include screenshots containing real IP addresses, credentials, provider IDs, or private topology details."

  repository_outputs:
    required_files:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.example.yml"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "app-manifest.yaml"
      - "docs/architecture.md"
      - "docs/compose-assistant.md"
      - "docs/security.md"
      - "docs/zimaos.md"
    app_manifest:
      required_fields:
        - "name"
        - "subtitle"
        - "version"
        - "build_date"
        - "git_sha"
        - "capabilities"
        - "required_services"
        - "optional_integrations"
        - "data_paths"
        - "healthcheck"

  localization:
    default_language: "English"
    supported_initial_languages:
      - "English"
      - "German"
    requirements:
      - "No hardcoded user-visible strings inside business logic."
      - "Technical variable names and code snippets remain unchanged."
      - "Generated manual steps follow the selected UI language."

  error_states:
    required:
      - id: "gluetun_unreachable"
        message_goal: "Explain that Tuniku is online but cannot reach the configured Gluetun Control Server."
      - id: "gluetun_unauthorized"
        message_goal: "Explain that the endpoint is reachable but credentials or authentication mode are incorrect."
      - id: "gluetun_unsupported_endpoint"
        message_goal: "Explain that the connected Gluetun version does not expose the requested capability."
      - id: "gluetun_schema_changed"
        message_goal: "Explain that the response format is not recognized and no unsafe action was attempted."
      - id: "tls_verification_failed"
        message_goal: "Explain certificate verification failure and discourage disabling verification without understanding the risk."
      - id: "compose_invalid"
        message_goal: "Show precise YAML parse or validation errors without losing the user's input."
      - id: "secret_in_plaintext"
        message_goal: "Warn and offer a Docker Secret alternative."
      - id: "docker_observation_unavailable"
        message_goal: "Continue with API and manual input instead of failing the whole application."
      - id: "action_timeout"
        message_goal: "State that the request result is unknown and refresh actual status before retrying."

  testing:
    unit:
      required:
        - "secret redaction"
        - "YAML generation"
        - "YAML validation"
        - "port collision detection"
        - "manual routing fragment generation"
        - "capability gating"
        - "auth input validation"
        - "first-run registration rules"
        - "draft persistence without secret leakage"
    integration:
      required:
        - "mock Gluetun Control Server with successful responses"
        - "unauthorized responses"
        - "unsupported endpoint responses"
        - "timeouts"
        - "changed response schema"
        - "VPN start and stop state verification"
        - "DNS advanced controls"
        - "updater start"
        - "port-forwarding read and supported write"
        - "optional read-only Docker proxy"
    end_to_end:
      required:
        - "first-run admin registration"
        - "login and logout"
        - "configure one Gluetun instance"
        - "test connection"
        - "view overview"
        - "start and stop VPN with confirmation"
        - "generate redacted Compose output"
        - "explicitly reveal a full secret snippet"
        - "copy and download generated artifacts"
        - "create and edit a local port label"
        - "mobile bottom navigation"
        - "desktop navigation rail"
        - "theme and mode persistence"
    security_tests:
      required:
        - "secrets absent from logs"
        - "secrets absent from database drafts by default"
        - "secrets absent from browser localStorage"
        - "compose input is never executed"
        - "foreign container mutation APIs do not exist"
        - "Docker observation cannot invoke write operations"
        - "CSRF protection on control actions"
        - "rate limiting on authentication and control actions"
        - "SSRF protections for configured instance URL"
    accessibility_tests:
      required:
        - "keyboard navigation"
        - "visible focus"
        - "screen-reader names for icon actions"
        - "WCAG AA contrast for all five themes in light and dark mode"
        - "reduced motion"

  acceptance_criteria:
    architecture:
      - "Tuniku and Gluetun deploy as separate Docker services."
      - "Tuniku has no runtime dependency on qBittorrent, Sonarr, Radarr, Prowlarr, or other app containers."
      - "Removing all foreign app containers does not impair core Tuniku functionality."
      - "Version 1 exposes one active Gluetun instance while the data model is multi-instance ready."
    safety_boundaries:
      - "No code path writes a host Compose file."
      - "No code path starts, stops, restarts, recreates, or modifies a foreign Docker container."
      - "No foreign application credentials are requested unless they are merely labels or example placeholders."
      - "Optional Docker access is read-only and disabled by default."
    control_api:
      - "VPN status, start, stop, public IP, DNS status, updater status/start, port-forwarding state, and redacted settings are exposed when supported."
      - "Unsupported capabilities are disabled and explained."
      - "Provider and VPN credential changes are handled through Compose guidance, not live writes."
    compose_assistant:
      - "Every generation result contains the five required output sections."
      - "Generated Compose YAML parses successfully before it is presented as valid."
      - "Manual steps explicitly state that the user must edit and redeploy the stack."
      - "A manual app-behind-Gluetun guide includes network_mode and Gluetun port publication."
      - "Plaintext secrets trigger a warning and a Docker Secret alternative."
      - "Tuniku never claims that a local label represents a live integration with qBittorrent or another app."
    secret_handling:
      - "Sensitive inputs are temporary by default."
      - "Full secret snippets require explicit user intent and show a warning."
      - "Stored secret values are encrypted and always masked."
      - "Secret values are absent from logs, diagnostics, and persisted drafts."
    user_experience:
      - "Mobile and desktop layouts follow Pixel Soft Utility."
      - "The global header contains no technical status or build metadata."
      - "Settings and About/Admin Info appear in a bottom sheet on mobile and a right side sheet on desktop."
      - "All five themes and all three modes work and persist through tuniku-theme and tuniku-mode."
      - "All primary touch targets are at least 44px."
    documentation:
      - "README clearly states every mandatory product boundary."
      - "README contains installation, first-run, Control Server, Compose Assistant, manual routing, secrets, and ZimaOS guidance."
      - "Example files contain placeholders only and are safe to commit."

  implementation_phases:
    - phase: 1
      name: "Foundation"
      deliverables:
        - "repository scaffold"
        - "database migrations"
        - "first-run authentication"
        - "Pixel Soft Utility tokens and themes"
        - "responsive shell and navigation"
        - "healthcheck"
    - phase: 2
      name: "Gluetun read-only dashboard"
      deliverables:
        - "instance configuration"
        - "connection test"
        - "capability detection"
        - "overview status"
        - "public IP"
        - "DNS, updater, port-forwarding, and redacted settings reads"
    - phase: 3
      name: "Allow-listed Gluetun controls"
      deliverables:
        - "VPN start and stop"
        - "updater start"
        - "advanced DNS start and stop"
        - "supported port-forwarding changes"
        - "confirmation, audit, and post-action verification"
    - phase: 4
      name: "Compose Assistant"
      deliverables:
        - "guided task flows"
        - "manual Compose inspection"
        - "YAML validation"
        - "secret-safe generation"
        - "copy and download artifacts"
        - "ZimaOS instructions"
    - phase: 5
      name: "Port overview and read-only Docker observation"
      deliverables:
        - "local labels"
        - "detected and planned ports"
        - "collision warnings"
        - "optional restricted Docker Socket Proxy integration"
    - phase: 6
      name: "Hardening and release"
      deliverables:
        - "security review"
        - "accessibility review"
        - "integration and end-to-end tests"
        - "README and docs"
        - "example deployment files"
        - "release build metadata in About/Admin Info"

  codex_execution_directive: >-
    Build Tuniku exactly within the boundaries of this specification. Do not broaden
    it into a Docker manager or a foreign-application manager. Implement the Gluetun
    adapter through an explicit capability and operation allow-list. Generate precise
    configuration instructions without writing or redeploying the user's Compose
    stack. Treat all provider credentials, private keys, API keys, Basic Auth values,
    and generated full snippets as secrets. Follow pixel_design.yaml for all visual
    decisions, responsive behavior, themes, settings placement, accessibility, and
    technical-information placement. Where the connected Gluetun version does not
    support a requested API operation or configuration name, report that limitation
    rather than inventing behavior.

  unresolved_questions: []
