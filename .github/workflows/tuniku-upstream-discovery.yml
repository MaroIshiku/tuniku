name: Tuniku upstream source discovery

on:
  schedule:
    - cron: '0 5 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tuniku-upstream-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Discover official source changes without updating or publishing
        id: sources
        run: node scripts/discover-upstreams.ts
      - name: Scan exact Gluetun amd64 candidate
        if: always() && steps.sources.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: qmcgaw/gluetun@${{ steps.sources.outputs.gluetun_amd64_digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          timeout: 10m
          format: json
          output: .ishiku/reports/gluetun-latest-amd64-trivy.json
      - name: Scan exact Gluetun arm64 candidate
        if: always() && steps.sources.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: qmcgaw/gluetun@${{ steps.sources.outputs.gluetun_arm64_digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          timeout: 10m
          format: json
          output: .ishiku/reports/gluetun-latest-arm64-trivy.json
      - name: Enforce bounded Gluetun amd64 release policy
        if: always() && steps.sources.outcome == 'success'
        run: node scripts/gluetun-scan-policy.mjs .ishiku/reports/gluetun-latest-amd64-trivy.json amd64 ${{ steps.sources.outputs.gluetun_amd64_digest }}
      - name: Enforce bounded Gluetun arm64 release policy
        if: always() && steps.sources.outcome == 'success'
        run: node scripts/gluetun-scan-policy.mjs .ishiku/reports/gluetun-latest-arm64-trivy.json arm64 ${{ steps.sources.outputs.gluetun_arm64_digest }}
      - name: Preserve source discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuniku-upstream-discovery-${{ github.run_id }}
          path: |
            .ishiku/reports/tuniku-upstream-discovery.json
            .ishiku/reports/gluetun-latest-*-trivy.json
            .ishiku/reports/gluetun-release-policy-*.json
          if-no-files-found: error
          retention-days: 30
