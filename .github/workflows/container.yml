name: Container

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ishiku-pull-request-verify.yml
    with:
      require_all_verified: true

  gluetun:
    uses: ./.github/workflows/tuniku-upstream-discovery.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [verify, gluetun]
    concurrency:
      group: tuniku-registry-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-info
        name: Resolve reproducible build metadata
        run: |
          version=$(node -p "require('./package.json').version")
          created=$(git show -s --format=%cI HEAD)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$created" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/maroishiku/tuniku
          tags: |
            type=raw,value=main-sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ steps.build-info.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-info.outputs.created }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            BUILD_DATE=${{ steps.build-info.outputs.created }}
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/maroishiku/tuniku
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify both exact architecture manifests at runtime
        id: architectures
        env:
          IMAGE: ghcr.io/maroishiku/tuniku
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/verify-image-architectures.ts
      - name: Block known high and critical vulnerabilities on amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/maroishiku/tuniku@${{ steps.architectures.outputs.amd64_digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m
      - name: Block known high and critical vulnerabilities on arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/maroishiku/tuniku@${{ steps.architectures.outputs.arm64_digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m
      - name: Promote the verified digest to latest
        env:
          IMAGE: ghcr.io/maroishiku/tuniku
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/promote-image.ts

      - name: Preserve the digest promotion report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            promotion-report.json
            architecture-runtime-report.json
          if-no-files-found: warn
          retention-days: 90
