name: Tuniku
subtitle: Gluetun Web Interface
version: 0.3.4
build_date: development
git_sha: development
capabilities:
  - gluetun_status
  - gluetun_allow_listed_control
  - compose_generation
  - provider_server_catalog
  - gluetun_failure_diagnostics
  - aggregate_vpn_traffic_accounting
  - port_overview
  - local_admin_authentication
required_services:
  - tuniku
optional_integrations:
  - gluetun_control_server
  - docker_gluetun_observer
data_paths:
  root: /data
  database: /data/tuniku.db
  logs: /data/logs
healthcheck: /health
