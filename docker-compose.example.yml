services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: ${HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE}
    volumes:
      - gluetun_data:/gluetun
    restart: unless-stopped

  tuniku:
    build: .
    image: ${TUNIKU_IMAGE:-ghcr.io/maroishiku/tuniku:0.3.1}
    ports:
      - "65001:8080/tcp"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      TUNIKU_DATA_PATH: /data
      ISHIKU_SETUP_SECRET_FILE: /run/secrets/ishiku_setup_secret
      TUNIKU_SECURE_COOKIES: ${TUNIKU_SECURE_COOKIES:-false}
      TUNIKU_TRUSTED_PROXY_COUNT: ${TUNIKU_TRUSTED_PROXY_COUNT:-0}
    secrets:
      - ishiku_setup_secret
    volumes:
      - tuniku_data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  tuniku_data:
  gluetun_data:

secrets:
  ishiku_setup_secret:
    file: ./secrets/setup_secret.txt
